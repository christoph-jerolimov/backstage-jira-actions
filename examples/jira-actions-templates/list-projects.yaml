apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-list-projects'
  title: 'Jira Test: List Projects'
  description: 'Lists the visible Jira projects, optionally filtered by name, via the jira-actions:list-projects action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: List projects
      properties:
        name:
          title: 'Name filter'
          type: string
          description: 'A case-insensitive filter matched against the project name or key'
        maxResults:
          title: 'Maximum results'
          type: number
          description: 'Maximum number of projects to return, default 50'
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'List projects'
      action: jira-actions:list-projects
      input:
        name: ${{ parameters.name }}
        maxResults: ${{ parameters.maxResults }}
        host: ${{ parameters.host }}
  output:
    text:
      - title: 'Projects'
        content: |
          | Key | Name | Description |
          | --- | --- | --- |
          {% for p in steps.invoke.output.projects %}| [${{ p.key }}](${{ p.url }}) | ${{ p.name }} | ${{ p.description }} |
          {% endfor %}
      - title: 'JSON'
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
