apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-list-backlog-work-items'
  title: 'Jira Test: List Backlog Work Items'
  description: 'Lists the backlog work items of a Jira board via the jira-actions:list-backlog-work-items action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: List backlog work items
      required:
        - boardId
      properties:
        boardId:
          title: 'Board ID'
          type: string
          description: 'The ID of the board, as returned by list-boards'
        maxResults:
          title: 'Maximum results'
          type: number
          description: 'Maximum number of items to return, default 50'
        pageToken:
          title: 'Page token'
          type: string
          description: 'An opaque cursor from a previous run to fetch the next page'
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'List backlog work items'
      action: jira-actions:list-backlog-work-items
      input:
        boardId: ${{ parameters.boardId }}
        maxResults: ${{ parameters.maxResults }}
        pageToken: ${{ parameters.pageToken }}
        host: ${{ parameters.host }}
  output:
    text:
      - title: 'Work items'
        content: |
          | Key | Summary | Status | Type | Assignee |
          | --- | --- | --- | --- | --- |
          {% for i in steps.invoke.output.items %}| [${{ i.key }}](${{ i.url }}) | ${{ i.summary }} | ${{ i.status }} | ${{ i.issueType }} | ${{ i.assignee }} |
          {% endfor %}
      - title: 'JSON'
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
