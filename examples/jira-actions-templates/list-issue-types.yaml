apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-list-issue-types'
  title: 'Jira Test: List Issue Types'
  description: 'Lists the issue types available in a Jira project via the jira-actions:list-issue-types action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: List issue types
      properties:
        projectKey:
          title: 'Project key'
          type: string
          description: 'The Jira project key to list issue types for; provide either this or a catalog entity'
        entityRef:
          title: 'Catalog entity'
          type: string
          description: 'A catalog entity whose jira/project-key annotation identifies the project; alternative to the project key'
          ui:field: EntityPicker
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'List issue types'
      action: jira-actions:list-issue-types
      input:
        projectKey: ${{ parameters.projectKey }}
        entityRef: ${{ parameters.entityRef }}
        host: ${{ parameters.host }}
  output:
    text:
      - title: 'Issue types'
        content: |
          {% for t in steps.invoke.output.issueTypes %}- **${{ t.name }}**{% if t.subtask %} (sub-task){% endif %}{% if t.description %} — ${{ t.description }}{% endif %}
          {% endfor %}
      - title: 'JSON'
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
