apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-update-work-item'
  title: 'Jira Test: Update Work Item'
  description: 'Modifies fields of an existing Jira work item via the jira-actions:update-work-item action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: Update work item
      required:
        - issueKey
      properties:
        issueKey:
          title: 'Issue key'
          type: string
          description: 'The key of the issue to update, e.g. PROJ-123'
        summary:
          title: 'New summary'
          type: string
          description: 'The new summary (title) of the issue'
        description:
          title: 'New description'
          type: string
          description: 'The new Markdown description of the issue (or ADF as JSON, or literal text, per the description format)'
        descriptionFormat:
          title: 'Description format'
          type: string
          description: 'How to interpret the description: markdown (default), adf, or text'
          enum:
            - markdown
            - adf
            - text
        labels:
          title: 'Labels'
          type: array
          description: 'The full new list of labels, replacing existing labels'
          items:
            type: string
        addLabels:
          title: 'Add labels'
          type: array
          description: 'Labels to add to the existing labels; cannot be combined with Labels'
          items:
            type: string
        removeLabels:
          title: 'Remove labels'
          type: array
          description: 'Labels to remove from the existing labels; cannot be combined with Labels'
          items:
            type: string
        assignee:
          title: 'New assignee'
          type: string
          description: 'A Jira account ID (Cloud) or username (Data Center)'
        issueType:
          title: 'New issue type'
          type: string
          description: 'The new issue type name, e.g. Story, Bug or Task'
        customFields:
          title: 'Custom fields'
          type: object
          description: 'Additional issue fields keyed by Jira field ID, e.g. customfield_10020; passed to Jira verbatim'
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'Update work item'
      action: jira-actions:update-work-item
      input:
        issueKey: ${{ parameters.issueKey }}
        summary: ${{ parameters.summary }}
        description: '${{ parameters.description }}'
        descriptionFormat: ${{ parameters.descriptionFormat }}
        labels: ${{ parameters.labels }}
        addLabels: ${{ parameters.addLabels }}
        removeLabels: ${{ parameters.removeLabels }}
        assignee: ${{ parameters.assignee }}
        issueType: ${{ parameters.issueType }}
        customFields: ${{ parameters.customFields }}
        host: ${{ parameters.host }}
  output:
    links:
      - title: Open issue
        url: ${{ steps.invoke.output.url }}
    text:
      - title: Result
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
