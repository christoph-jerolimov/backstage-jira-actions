apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-create-work-item'
  title: 'Jira Test: Create Work Item'
  description: 'Creates a Jira work item (issue) such as a Story, Bug or Task via the jira-actions:create-work-item action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: Create work item
      required:
        - issueType
        - summary
      properties:
        projectKey:
          title: 'Project key'
          type: string
          description: 'The key of the Jira project, e.g. PROJ; provide either this or a catalog entity'
        entityRef:
          title: 'Catalog entity'
          type: string
          description: 'A catalog entity whose jira/project-key annotation identifies the project; alternative to the project key'
          ui:field: EntityPicker
        issueType:
          title: 'Issue type'
          type: string
          description: 'The issue type name, e.g. Story, Bug or Task'
        summary:
          title: 'Summary'
          type: string
          description: 'The summary (title) of the issue'
        description:
          title: 'Description'
          type: string
          description: 'A Markdown description of the issue (or ADF as JSON, or literal text, per the description format)'
        descriptionFormat:
          title: 'Description format'
          type: string
          description: 'How to interpret the description: markdown (default), adf, or text'
          enum:
            - markdown
            - adf
            - text
        labels:
          title: 'Labels'
          type: array
          description: 'Labels to set on the issue'
          items:
            type: string
        assignee:
          title: 'Assignee'
          type: string
          description: 'A Jira account ID (Cloud) or username (Data Center)'
        parentKey:
          title: 'Parent issue key'
          type: string
          description: 'The key of a parent issue, for sub-tasks or issues under an epic'
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'Create work item'
      action: jira-actions:create-work-item
      input:
        projectKey: ${{ parameters.projectKey }}
        entityRef: ${{ parameters.entityRef }}
        issueType: ${{ parameters.issueType }}
        summary: ${{ parameters.summary }}
        description: '${{ parameters.description }}'
        descriptionFormat: ${{ parameters.descriptionFormat }}
        labels: ${{ parameters.labels }}
        assignee: ${{ parameters.assignee }}
        parentKey: ${{ parameters.parentKey }}
        host: ${{ parameters.host }}
  output:
    links:
      - title: Open issue
        url: ${{ steps.invoke.output.url }}
    text:
      - title: Result
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
