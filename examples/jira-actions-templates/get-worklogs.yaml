apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-get-worklogs'
  title: 'Jira Test: Get Worklogs'
  description: 'Reads the work log entries of a Jira work item via the jira-actions:get-worklogs action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: Get worklogs
      required:
        - issueKey
      properties:
        issueKey:
          title: 'Issue key'
          type: string
          description: 'The key of the issue, e.g. PROJ-123'
        commentFormat:
          title: 'Comment format'
          type: string
          description: 'How to render each worklog comment: markdown (default), adf, or text'
          enum:
            - markdown
            - adf
            - text
        maxResults:
          title: 'Maximum results'
          type: number
          description: 'Maximum number of worklogs to return, default 50'
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'Get worklogs'
      action: jira-actions:get-worklogs
      input:
        issueKey: ${{ parameters.issueKey }}
        commentFormat: ${{ parameters.commentFormat }}
        maxResults: ${{ parameters.maxResults }}
        host: ${{ parameters.host }}
  output:
    links:
      - title: Open issue
        url: ${{ steps.invoke.output.url }}
    text:
      - title: 'Worklogs'
        content: |
          {% for w in steps.invoke.output.worklogs %}**${{ w.author or 'Unknown' }}** — ${{ w.timeSpent }} — ${{ w.started }}

          ${{ w.comment }}

          ---

          {% endfor %}
      - title: 'JSON'
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
