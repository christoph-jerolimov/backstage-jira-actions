apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: 'jira-test-list-components'
  title: 'Jira Test: List Components'
  description: 'Lists the components of a Jira project via the jira-actions:list-components action.'
  tags:
    - jira
    - test
spec:
  owner: user:guest
  type: jira-test
  parameters:
    - title: List components
      properties:
        projectKey:
          title: 'Project key'
          type: string
          description: 'The Jira project key, e.g. PROJ; provide either this or a catalog entity'
        entityRef:
          title: 'Catalog entity'
          type: string
          description: 'A catalog entity whose jira/project-key annotation identifies the project; alternative to the project key'
          ui:field: EntityPicker
        host:
          title: 'Jira host'
          type: string
          description: 'Only needed when multiple Jira connections are configured'
  steps:
    - id: invoke
      name: 'List components'
      action: jira-actions:list-components
      input:
        projectKey: ${{ parameters.projectKey }}
        entityRef: ${{ parameters.entityRef }}
        host: ${{ parameters.host }}
  output:
    text:
      - title: 'Components'
        content: |
          | Name | Description | Lead |
          | --- | --- | --- |
          {% for c in steps.invoke.output.components %}| ${{ c.name }} | ${{ c.description }} | ${{ c.lead }} |
          {% endfor %}
      - title: 'JSON'
        content: |
          ```json
          ${{ steps.invoke.output | dump(2) }}
          ```
